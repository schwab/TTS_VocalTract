[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vocaltract"
version = "0.1.0"
description = "Differentiable, LPC-based neural vocoder inspired by the Parallax Propeller VocalTract"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchlpc>=0.7.2,<0.8",
    "numpy",
    "scipy",
    "soundfile",
]

[project.optional-dependencies]
dev = ["pytest", "tqdm"]
reference = ["numba"]
analysis = ["numba", "praat-parselmouth", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
